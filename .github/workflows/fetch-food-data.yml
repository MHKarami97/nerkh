name: Refresh Food Price Snapshots

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-food-data
  cancel-in-progress: true

jobs:
  fetch-protein-chicken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.47.0
          npx playwright install --with-deps chromium
      - name: Fetch chicken prices
        run: node scripts/fetch-protein-chicken.mjs
      - name: Commit updated chicken snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/protein-chicken.json
          if git diff --cached --quiet; then
            echo "No chicken data changes, skipping commit."
          else
            git commit -m "chore(data): refresh chicken snapshot [skip ci]"
            git pull --rebase origin main
            git push
          fi

