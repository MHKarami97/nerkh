name: Refresh Food Price Snapshots

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-food-data
  cancel-in-progress: true

jobs:
  fetch-food-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: Fetch all food categories sequentially
        shell: bash
        run: |
          set -Eeuo pipefail

          scripts=(
            fetch-protein-chicken.mjs
            fetch-protein-sheep.mjs
            fetch-protein-veal.mjs
            fetch-protein-aquatic.mjs
            fetch-protein-poultry.mjs
            fetch-beans.mjs
            fetch-dried-fruits.mjs
          )

          for script in "${scripts[@]}"; do
            echo "============================================================"
            echo "Starting ${script}"
            echo "============================================================"
            node "scripts/${script}"
            echo "Completed ${script}"
            echo
          done

      - name: Commit updated snapshots
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add public/data/*.json

          if git diff --cached --quiet; then
            echo 'No food data changes; skipping commit.'
            exit 0
          fi

          git commit -m 'chore(data): refresh food price snapshots [skip ci]'
          git push