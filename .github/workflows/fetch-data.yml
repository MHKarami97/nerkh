name: Refresh Market Data Mirror

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: true

jobs:
  fetch-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch market data
        run: node scripts/fetch-market-data.mjs
      - name: Commit updated market snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json
          if git diff --cached --quiet; then
            echo "No market data changes, skipping commit."
          else
            git pull --rebase origin main
            git commit -m "chore(data): refresh market snapshot [skip ci]"
            git push
          fi

  fetch-produce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch produce prices
        id: produce
        continue-on-error: true
        run: node scripts/fetch-produce-data.mjs
      - name: Commit updated produce snapshot if changed
        if: steps.produce.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/produce.json
          if git diff --cached --quiet; then
            echo "No produce data changes, skipping commit."
          else
            git pull --rebase origin main
            git commit -m "chore(data): refresh produce snapshot [skip ci]"
            git push
          fi
      - name: Report produce fetch failure
        if: steps.produce.outcome == 'failure'
        run: echo '::warning::Produce price fetch failed; keeping previous public/data/produce.json snapshot.'
